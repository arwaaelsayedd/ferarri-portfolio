<!-- footer.html -->
<footer class="site-footer">
  <div class="container footer-grid">
    <div *ngIf="homeService.home$ | async as home">
      <h4>{{ home.title }}</h4>
      <p>{{ home.subtitle }}</p>
    </div>

    <div *ngIf="contactService.contact$ | async as contact">
      <p>{{ contact.address }}</p>
      <p>{{ contact.phone }} | {{ contact.email }}</p>
    </div>
  </div>
  <div class="footer-bottom">
    <p>© {{ currentYear }} All Rights Reserved.</p>
  </div>
</footer>
