<section id="about" class="about-section">
  <div class="about-container">
    <div class="about-media">
      <img *ngIf="aboutData.image" [src]="aboutData.image" [alt]="aboutData.title" class="about-img" />
      <div class="about-badge" *ngIf="aboutData.badgeYears">
        <span class="badge-number">{{ aboutData.badgeYears }}</span>
        <span class="badge-label">Racing Pedigree</span>
      </div>
    </div>

    <div class="about-content">
      <span class="about-eyebrow">{{ aboutData.eyebrow }}</span>
      <h2 class="about-title">{{ aboutData.title }}</h2>
      <p class="about-description">{{ aboutData.description }}</p>
    </div>
  </div>
</section>
