<section id="contact" class="contact-section">
  <div class="contact-container">
    <div class="contact-info">
      <span class="section-eyebrow">Private Concierge</span>
      <h2 class="section-title">CONTACT US</h2>
      <p class="contact-lead">Reach out for private appointments, bespoke consultations, or showroom inquiries.</p>

      <div class="info-list">
        <div class="info-item">
          <span class="info-label">Address</span>
          <span class="info-value">{{ contactInfo.address }}</span>
        </div>
        <div class="info-item">
          <span class="info-label">Phone</span>
          <span class="info-value">{{ contactInfo.phone }}</span>
        </div>
        <div class="info-item">
          <span class="info-label">Email</span>
          <span class="info-value">{{ contactInfo.email }}</span>
        </div>
      </div>
    </div>

    <form class="contact-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" [(ngModel)]="formData.name" required placeholder="Your name" />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" [(ngModel)]="formData.email" required placeholder="name@example.com" />
      </div>

      <div class="form-group">
        <label>Message</label>
        <textarea name="message" rows="4" [(ngModel)]="formData.message" required placeholder="How can we help?"></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>
      <p class="success-msg" *ngIf="submitted">Message sent successfully.</p>
    </form>
  </div>
</section>
