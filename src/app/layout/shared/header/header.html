<header class="site-header">
  <div class="header-container">
    <!-- Brand Logo -->
    <a routerLink="/home" class="brand-link">
      <img [src]="logoUrl" alt="Brand Logo" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-title">{{ brandTitle }}</span>
        <span class="brand-sub">ATELIER • MODENA</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav-links" [class.open]="menuOpen">
      <a routerLink="/home" routerLinkActive="active" (click)="menuOpen = false">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="menuOpen = false">About</a>
      <a routerLink="/services" routerLinkActive="active" (click)="menuOpen = false">Our Services</a>
      <a routerLink="/clients" routerLinkActive="active" (click)="menuOpen = false">Our Clients</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="menuOpen = false">Contact Us</a>
    </nav>

    <!-- Actions -->
    <div class="header-actions">
      <a routerLink="/dashboard" class="admin-btn">Admin</a>
      <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle Menu">
        ☰
      </button>
    </div>
  </div>
</header>
