<!-- header.html -->
<header class="site-header" *ngIf="homeService.home$ | async as home">
  <div class="container nav-wrapper">
    <a routerLink="/home" class="brand">
      <img *ngIf="home.logoUrl" [src]="home.logoUrl" alt="Brand Logo" class="brand-logo" />
      <span class="brand-title">{{ home.eyebrow }}</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/home" routerLinkActive="active">Home</a>
      <a routerLink="/about" routerLinkActive="active">About</a>
      <a routerLink="/services" routerLinkActive="active">Services</a>
      <a routerLink="/clients" routerLinkActive="active">Clients</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
      <a routerLink="/dashboard" class="admin-btn">Admin</a>
    </nav>
  </div>
</header>
